# Native builds, sanitizers and the linter. The WASM builds and the Netlify
# deploy are in web.yml. The jobs do not depend on `lint`: it is short, and
# waiting on it delays every build by a scheduling round trip, minutes when
# several branches are pushed at once. A lint failure still fails the run.
# See features/2026/09/ci-consolidation.md.
name: CMake Multiplatform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=Release
          -DWISDOM_CHESS_CONSOLE_UI=Off
          -DWISDOM_CHESS_QML_UI=Off
          -DWISDOM_CHESS_FAST_TESTS=Off
          -DWISDOM_CHESS_SLOW_TESTS=Off
          -S ${{ github.workspace }}

      - name: Build Linter
        run: cmake --build ${{ github.workspace }}/build --target wisdom-linter -j 4

      - name: Run Linter Self-Tests
        run: ./scripts/linter/tests/run-tests.sh ${{ github.workspace }}/build/scripts/linter/wisdom-linter

      - name: Run Linter
        run: cmake --build ${{ github.workspace }}/build --target lint

  # One RelWithDebInfo build per platform: it is the configuration the
  # React WASM build deploys. Release is covered once, in
  # build-release-debug-filc.
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: RelWithDebInfo
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            build_type: RelWithDebInfo
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            build_type: RelWithDebInfo
            c_compiler: cl
            cpp_compiler: cl
            cmake_generator: Ninja

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.*'
        cache: true

    - name: Set up MSVC dev environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache CPM downloads
      uses: actions/cache@v4
      with:
        path: ~/cpm-cache
        key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        ${{ matrix.cmake_generator && format('-G {0}', matrix.cmake_generator) }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCPM_SOURCE_CACHE=~/cpm-cache
        -DWISDOM_CHESS_QML_UI=On
        -DWISDOM_CHESS_FAST_TESTS=On
        -DWISDOM_CHESS_SLOW_TESTS=On
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j 4

    - name: Lint QML
      # The result does not depend on the platform or the configuration.
      # src/wisdom-chess/ui/qml/.qmllint.ini makes any warning fail it.
      if: runner.os == 'Linux'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --target all_qmllint

    - name: Run Tests
      run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --build-config ${{ matrix.build_type }} --output-on-failure -j 4

    - name: Install (CMake)
      # Smoke-test the install rules into a scratch prefix. The default prefix
      # (/usr/local) is not writable at its top level on the macOS runners,
      # and the app bundle now installs relative to the prefix.
      run: >
        cmake --install ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --prefix ${{ github.workspace }}/install-test

  # Three short Linux builds on one runner, each in its own build directory,
  # so they do not each take a runner slot. Together they take about as long
  # as the WASM job in web.yml, so nothing else should be added here.
  #
  # - Release, with the slow tests, so the engine is still tested at -O3.
  # - Debug, so code that only compiles inside assert() is checked. The
  #   slow tests are far too slow without optimization.
  # - FIL-C, a memory-safe C++ compiler, over the engine's fast tests.
  build-release-debug-filc:
    runs-on: ubuntu-latest

    env:
      FILC_VERSION: "0.678"

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.*'
        cache: true

    - name: Cache CPM downloads
      uses: actions/cache@v4
      with:
        path: ~/cpm-cache
        key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    - name: Configure CMake (Release)
      run: >
        cmake -B ${{ github.workspace }}/build-release
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_BUILD_TYPE=Release
        -DCPM_SOURCE_CACHE=~/cpm-cache
        -DWISDOM_CHESS_QML_UI=On
        -DWISDOM_CHESS_BUILD_LINTER=Off
        -DWISDOM_CHESS_FAST_TESTS=On
        -DWISDOM_CHESS_SLOW_TESTS=On
        -S ${{ github.workspace }}

    - name: Build (Release)
      run: cmake --build ${{ github.workspace }}/build-release -j 4

    - name: Run Tests (Release)
      run: ctest --test-dir ${{ github.workspace }}/build-release --output-on-failure -j 4

    - name: Configure CMake (Debug)
      run: >
        cmake -B ${{ github.workspace }}/build-debug
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_BUILD_TYPE=Debug
        -DCPM_SOURCE_CACHE=~/cpm-cache
        -DWISDOM_CHESS_QML_UI=On
        -DWISDOM_CHESS_BUILD_LINTER=Off
        -DWISDOM_CHESS_FAST_TESTS=On
        -DWISDOM_CHESS_SLOW_TESTS=Off
        -S ${{ github.workspace }}

    - name: Build (Debug)
      run: cmake --build ${{ github.workspace }}/build-debug -j 4

    - name: Run Tests (Debug)
      run: ctest --test-dir ${{ github.workspace }}/build-debug --output-on-failure -j 4

    - name: Cache FIL-C installation
      id: cache-filc
      uses: actions/cache@v4
      with:
        path: filc-${{ env.FILC_VERSION }}-linux-x86_64
        key: filc-${{ env.FILC_VERSION }}-linux-x86_64

    - name: Install FIL-C
      if: steps.cache-filc.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update && sudo apt-get install -y patchelf
        curl -L -o filc.tar.xz https://github.com/pizlonator/fil-c/releases/download/v${{ env.FILC_VERSION }}/filc-${{ env.FILC_VERSION }}-linux-x86_64.tar.xz
        tar xf filc.tar.xz
        cd filc-${{ env.FILC_VERSION }}-linux-x86_64
        ./setup.sh

    - name: Verify FIL-C
      run: filc-${{ env.FILC_VERSION }}-linux-x86_64/build/bin/fil++ --version

    - name: Configure CMake (FIL-C)
      run: >
        cmake -B ${{ github.workspace }}/build-filc
        -DCMAKE_CXX_COMPILER=${{ github.workspace }}/filc-${{ env.FILC_VERSION }}-linux-x86_64/build/bin/fil++
        -DCMAKE_BUILD_TYPE=Release
        -DWISDOM_CHESS_CONSOLE_UI=Off
        -DWISDOM_CHESS_QML_UI=Off
        -DWISDOM_CHESS_FAST_TESTS=On
        -DWISDOM_CHESS_SLOW_TESTS=Off
        -DWISDOM_CHESS_BUILD_LINTER=Off
        -S ${{ github.workspace }}

    - name: Build (FIL-C)
      run: cmake --build ${{ github.workspace }}/build-filc -j 4

    - name: Run Tests (FIL-C)
      run: ctest --test-dir ${{ github.workspace }}/build-filc --output-on-failure -j 4

  # ThreadSanitizer is not here: it needs a Qt that is instrumented too,
  # which is too slow to build on every run. Run it with
  # ./scripts/build-tsan.sh instead.
  sanitizers:
    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/sanitizers/lsan.supp

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.*'
        cache: true

    - name: Cache CPM downloads
      uses: actions/cache@v4
      with:
        path: ~/cpm-cache
        key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCPM_SOURCE_CACHE=~/cpm-cache
        -DWISDOM_CHESS_QML_UI=On
        -DWISDOM_CHESS_BUILD_LINTER=Off
        -DWISDOM_CHESS_FAST_TESTS=On
        -DWISDOM_CHESS_SLOW_TESTS=On
        -DWISDOM_CHESS_ASAN=On
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build -j 4

    - name: Run Tests
      run: ctest --test-dir ${{ github.workspace }}/build --output-on-failure -j 4
